[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dosravi"
version = "0.1.1"
description = "Reliable remote control and file transfer for MS-DOS computers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DOSRAVI contributors"}]

[project.scripts]
dosravi = "dosravi.cli:main"

[project.optional-dependencies]
test = ["hypothesis>=6.100", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["dosravi*"]
