name: CI
on:
  push:
  pull_request:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y afl++ bcc bin86 clang cppcheck nasm
      - run: python -m pip install -e '.[test]'
      - run: make check
      - run: make fuzz
      - run: make dos
