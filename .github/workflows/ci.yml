name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select checks
        id: checks
        run: python tools/select_ci.py
      - name: Initialize pinned RAVI library
        if: steps.checks.outputs.native == 'true'
        run: git submodule update --init third_party/ravi
      - name: Install native toolchain
        if: steps.checks.outputs.native == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bcc bin86 elks-libc cppcheck nasm
          python -m pip install -e '.[test]'
      - name: Native contracts and static checks
        if: steps.checks.outputs.native == 'true'
        run: make check
      - name: Verify pin and installed CLI
        if: steps.checks.outputs.native == 'true'
        run: |
          revision=$(git rev-parse HEAD:third_party/ravi)
          python -c 'import pathlib, sys; assert "@" + sys.argv[1] in pathlib.Path("pyproject.toml").read_text()' "$revision"
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/dos-wheel"
          python -m venv "$RUNNER_TEMP/dos-installed"
          "$RUNNER_TEMP/dos-installed/bin/pip" install "$RUNNER_TEMP"/dos-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dos-installed/bin/dosravi" --help
      - name: Decoder fuzz smoke
        if: steps.checks.outputs.fuzz == 'true'
        timeout-minutes: 3
        run: |
          sudo apt-get install -y --no-install-recommends afl++ clang
          make fuzz
      - name: Actual DOS agent integration
        if: steps.checks.outputs.dos == 'true'
        timeout-minutes: 7
        env:
          # 8086 is the physical target; retain both CPU variants for manual full runs.
          DOSRAVI_TEST_CPUS: ${{ github.event_name == 'workflow_dispatch' && '8086 80186' || '8086' }}
        run: |
          sudo apt-get install -y --no-install-recommends dosbox-x
          make dos-test
